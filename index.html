<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tyche" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#5E268B" />
    <title>Tyche — Safety, support & justice, on your terms</title>
    <meta name="description" content="Keep your evidence safe, talk to a verified lawyer, report when you're ready, and find your people. Built for women in Nigeria." />
    <meta property="og:title" content="Tyche" />
    <meta property="og:description" content="Your safety matters. Your voice matters. Justice matters." />
    <meta property="og:image" content="/og-cover.jpg" />
    <!-- Fonts are bundled with the site (no requests to Google Fonts, so visitors' IPs aren't shared). -->
    <style>
      #boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FFFBF7; font-family: system-ui, sans-serif; color: #5E268B; text-align: center; padding: 24px; }
      #boot img { width: 84px; height: auto; animation: tyche-pulse 1.4s ease-in-out infinite; }
      #boot p { margin: 0; font-size: 15px; }
      #boot .err { display: none; max-width: 420px; font-size: 13px; color: #2A1838; background: #FDEDEA; border-radius: 16px; padding: 12px 14px; word-break: break-word; }
      #boot a { color: #5E268B; font-weight: 600; }
      @keyframes tyche-pulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(.92); opacity: .75 } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <img src="/tyche-mark.png" alt="Tyche" />
        <p id="boot-msg">Loading Tyche…</p>
        <p class="err" id="boot-err"></p>
      </div>
    </div>
    <noscript>
      <p style="font-family:system-ui;text-align:center;padding:24px;color:#5E268B">Tyche needs JavaScript. Please open this link in Chrome or Safari (not Opera Mini's data-saving mode).</p>
    </noscript>
    <script>
      // If the app fails to start, show why instead of a blank page.
      (function () {
        function show(msg) {
          var e = document.getElementById("boot-err"), m = document.getElementById("boot-msg");
          if (!e) return;
          m.innerHTML = 'Tyche couldn\'t start on this browser. Try updating it or opening the link in Chrome. <a href="/">Reload</a>';
          e.style.display = "block";
          e.textContent = String(msg).slice(0, 300);
        }
        window.addEventListener("error", function (ev) { show(ev.message || ev.error); });
        window.addEventListener("unhandledrejection", function (ev) { show(ev.reason && ev.reason.message || ev.reason); });
        setTimeout(function () { if (document.getElementById("boot")) show("Still loading after 15s — your connection may be slow or a script was blocked."); }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
